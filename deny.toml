[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Reached through the operation catalog's home: `borrow-or-share` (MIT-0) via
    # `fluent-uri`. Permissive and compatible with AGPL-3.0-or-later.
    "MIT-0",
    # `ar_archive_writer` (a build dependency of `stacker`, reached through the IR
    # and FSL dependencies). Apache-2.0 plus LLVM's standard exception; still permissive.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9
# First-party agent-ix crates are AGPL-3.0-or-later (owner decision 2026-09-14,
# agent-ix/filament-contract-codegen#45). Exceptions are scoped to this crate and the
# sibling filament-contract-* crates it consumes so the third-party allow-list stays
# permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "filament-contract-codegen" },
    # First-party compile-time macro for production #[implements] markers. Scoped to
    # ix-trace-rs; remove this exception when CG removes those markers and the dependency.
    { allow = ["AGPL-3.0-or-later"], crate = "ix-trace-rs" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-contract-ir" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-contract-model" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-contract-runtime" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-verification-contracts" },
    # IR-254: fsl-replay (the only FSL crate this repository may depend on, per
    # FSL arch-lint T12-A) and its own transitive closure -- all first-party
    # agent-ix crates under the same AGPL-3.0-or-later decision above.
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-cst" },
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-eval" },
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-forms" },
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-foundation" },
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-package" },
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-replay" },
    { allow = ["AGPL-3.0-or-later"], crate = "fsl-semantics" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical-derive" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-checked" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-exact" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-eval" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-semantic-value" },
    { allow = ["AGPL-3.0-or-later"], crate = "filament-walk" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-rs" },
    { allow = ["AGPL-3.0-or-later"], crate = "agent-ix-extraction-frontend" },
    { allow = ["AGPL-3.0-or-later"], crate = "agent-ix-semantic-ir" },
    # quire-rs resolves this first-party AGPL schema from filament-core-data.
    { allow = ["AGPL-3.0-or-later"], crate = "agent-ix-semantic-schema" },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2
# RUSTSEC-2026-0009 is in `time`, reached through jsonschema; it is reachable only through an
# unused RFC-2822 parser.
ignore = ["RUSTSEC-2026-0009"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every first-party agent-ix repository the resolved graph actually reaches. The
# list is the whole point of the check: a git source outside it is an unreviewed
# dependency and fails.
allow-git = [
    "https://github.com/agent-ix/filament-core-data",
    "https://github.com/agent-ix/ix-trace-rs",
    "https://github.com/agent-ix/quire-canonical",
    "https://github.com/agent-ix/filament-contract-ir",
    "https://github.com/agent-ix/filament-contract-runtime",
    "https://github.com/agent-ix/filament-exact",
    "https://github.com/agent-ix/filament-eval",
    "https://github.com/agent-ix/quire-rs",
    "https://github.com/agent-ix/filament-semantic-value",
    "https://github.com/agent-ix/filament-spec-language",
    # Published FSpec qualification vectors used by the model-variant agreement dev dependency.
    "https://github.com/agent-ix/filament-specification",
    "https://github.com/agent-ix/filament-verification-contracts",
    "https://github.com/agent-ix/filament-walk",
]
