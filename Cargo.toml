[package]
name = "filament-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Deterministic Rust, property-test, proof, and evidence generation from Filament contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/filament-contract-codegen"

[workspace]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[lib]
name = "filament_contract_codegen"
path = "src/lib.rs"

[[bin]]
name = "cg_gates"
path = "scripts/cg_gates.rs"

[dependencies]
# Interim rev pin (QSL-2499 / QSL-2359): first-party crates pin merged main revs; swap to tags at the end-of-program tag set.
ix-trace-rs = { version = "0.1.2", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616" }
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "6e809434d5fd7bde4c5b88ec40cd809efcca595d" }
filament-contract-ir = { version = "0.1.5", git = "https://github.com/agent-ix/filament-contract-ir", rev = "dacfac6b371b89f1942849e3c502ad01fbb68d2c" }
# The model items (`CheckedPackageV2`, `RequirementRef`, ...) come from filament-contract-model, a crate in
# the same repository and the same lock entry as filament-contract-ir; the IR root crate is named only
# for its `kani` module (IR AD-006 R3-C2).
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "dacfac6b371b89f1942849e3c502ad01fbb68d2c" }
filament-contract-runtime = { version = "0.1.1", git = "https://github.com/agent-ix/filament-contract-runtime", rev = "93e3681ad772971e48c5d2804969e5940b1a131d" }
# fsl-replay is the admitted-context facade; fsl-package supplies its structural identities.
# replay adapter in src/replay/function.rs builds its requests from `call_site` and the crate's own
# re-exports and goes through its `replay` entry. Cargo.lock records the selected public source.
# QSL-2184 paired pin: keep FSL at the same merged revision in contract-codegen and the driver.
fsl-replay = { version = "0.3.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "7c3a8f1a6990701866a1ec49029c62a7076067b2" }
fsl-package = { version = "0.3.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "7c3a8f1a6990701866a1ec49029c62a7076067b2" }
filament-eval = { version = "0.1.6", git = "https://github.com/agent-ix/filament-eval", rev = "89573102cc309941786e3693b2f71e254dddc91c" }
# RFC 8785 encoding for CG artifact JSON, document content hashes, and fixed-shape records.
quire-canonical = { version = "0.3.1", git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", features = ["serde_json"] }
libc = "0.2"
num-bigint = "0.4.8"
quote = "1.0"
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "process", "time", "pipe", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
semver = "1.0"
syn = { version = "2.0.119", features = ["full", "visit"] }

[dev-dependencies]
filament-specification = { package = "filament-specification-qualification", version = "0.1.1", git = "https://github.com/agent-ix/filament-specification", rev = "247a394157b58843643a61dfde16280c25d733c0" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "dacfac6b371b89f1942849e3c502ad01fbb68d2c", features = ["test-support"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }
sha2 = "0.10.9"
filament-contract-runtime = { version = "0.1.1", git = "https://github.com/agent-ix/filament-contract-runtime", rev = "93e3681ad772971e48c5d2804969e5940b1a131d", features = ["proptest", "exact"] }
# The home of the checked-operation catalog Contract IR validates against; tests select law
# definitions from it instead of copying them.
filament-verification-contracts = { version = "0.2.1", git = "https://github.com/agent-ix/filament-verification-contracts", rev = "cd0c8ef67e5d4263ce12773831cedd771246e5e5" }


[profile.release]
lto = "thin"
codegen-units = 1
