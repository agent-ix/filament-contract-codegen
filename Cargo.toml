[package]
name = "filament-contract-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
build = "build.rs"
description = "Deterministic Rust, property-test, proof, and evidence generation from Filament contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/filament-contract-codegen"

[workspace]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[lib]
name = "filament_contract_codegen"
path = "src/lib.rs"

[[bin]]
name = "cg_gates"
path = "scripts/cg_gates.rs"

[dependencies]
# Interim rev pin (QSL-2499 / QSL-2359): first-party crates pin merged main revs; swap to tags at the end-of-program tag set.
ix-trace-rs = { version = "0.1.2", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
filament-exact = { version = "0.3.0", git = "https://github.com/agent-ix/filament-exact", rev = "743c42e4e458782bf7a8befc3b76cc8a190ed727" }
filament-semantic-value = { version = "0.1.5", git = "https://github.com/agent-ix/filament-semantic-value", rev = "bb9e9053a6b60d5695d0585add616beaee859543" }
filament-contract-ir = { version = "0.1.5", git = "https://github.com/agent-ix/filament-contract-ir", rev = "e3849c3b78fd9c8f9dec2e577a1b040c6f0b5c39" }
# The IR root crate supplies Kani outcomes; model API consumers pin its own public crate revision.
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "e3849c3b78fd9c8f9dec2e577a1b040c6f0b5c39" }
filament-contract-runtime = { version = "0.1.1", git = "https://github.com/agent-ix/filament-contract-runtime", rev = "370006f9fdd9494ef1d7b19db27bb4965e9c3640" }
# fsl-replay is the admitted-context facade; fsl-package supplies its structural identities.
# replay adapter in src/replay/function.rs builds its requests from `call_site` and the crate's own
# re-exports and goes through its `replay` entry. Cargo.lock records the selected public source.
# These FSL crates share the evaluation-core pin used by this crate.
fsl-replay = { version = "0.3.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "21fddad6c699c843007952b80b15aa2f2abe4613" }
fsl-package = { version = "0.3.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "21fddad6c699c843007952b80b15aa2f2abe4613" }
fsl-cst = { version = "0.1.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "21fddad6c699c843007952b80b15aa2f2abe4613" }
filament-eval = { version = "0.1.6", git = "https://github.com/agent-ix/filament-eval", rev = "5d852cedc1daa5295b75df5518b551f83c1cd359" }
# RFC 8785 encoding for CG artifact JSON, document content hashes, and fixed-shape records.
quire-canonical = { version = "0.3.3", git = "https://github.com/agent-ix/quire-canonical", tag = "quire-canonical-v0.3.3", features = ["serde_json"] }
libc = "0.2"
num-bigint = "0.4.8"
quote = "1.0"
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "process", "time", "pipe", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
semver = "1.0"
syn = { version = "2.0.119", features = ["full", "visit"] }

[build-dependencies]
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
fsl-eval = { version = "0.1.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "2171dbc8b1cea5cc50c604407f89f72cdcaf31ab" }
fsl-semantics = { version = "0.1.0", git = "https://github.com/agent-ix/filament-spec-language", rev = "2171dbc8b1cea5cc50c604407f89f72cdcaf31ab" }
filament-specification = { package = "filament-specification-qualification", version = "0.1.1", git = "https://github.com/agent-ix/filament-specification", rev = "3200a4ed7f18fbbf5d934c22d3c3fa467914ddca" }
filament-contract-model = { version = "0.1.2", git = "https://github.com/agent-ix/filament-contract-ir", rev = "e3849c3b78fd9c8f9dec2e577a1b040c6f0b5c39", features = ["test-support"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }
sha2 = "0.10.9"
filament-contract-runtime = { version = "0.1.1", git = "https://github.com/agent-ix/filament-contract-runtime", rev = "370006f9fdd9494ef1d7b19db27bb4965e9c3640", features = ["proptest", "exact"] }
# The home of the checked-operation catalog Contract IR validates against; tests select law
# definitions from it instead of copying them.
filament-verification-contracts = { version = "0.2.1", git = "https://github.com/agent-ix/filament-verification-contracts", rev = "16ba4da3141b524305d49cb630f30ac4d20f2881" }


[profile.release]
lto = "thin"
codegen-units = 1
